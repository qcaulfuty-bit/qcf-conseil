<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Lato:wght@400;700&display=swap');
      .serif { font-family: 'Playfair Display', 'Didot', 'Bodoni 72', Georgia, 'Times New Roman', serif; }
      .sans  { font-family: 'Lato', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    ]]></style>

    <linearGradient id="bgTexture" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F2E8"/>
      <stop offset="100%" stop-color="#F1EADC"/>
    </linearGradient>

    <linearGradient id="goldGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#9A7D41"/>
      <stop offset="50%"  stop-color="#D4B773"/>
      <stop offset="100%" stop-color="#9A7D41"/>
    </linearGradient>
  </defs>

  <!-- Fond blanc cassé avec très léger dégradé -->
  <rect width="1080" height="1080" fill="url(#bgTexture)"/>

  <!-- Double cadre doré, fin et sobre -->
  <rect x="48" y="48" width="984" height="984" fill="none" stroke="#B8975A" stroke-width="1.2"/>
  <rect x="62" y="62" width="956" height="956" fill="none" stroke="#B8975A" stroke-width="0.5" opacity="0.45"/>

  <!-- Angles : équerres dorées discrètes -->
  <g stroke="#B8975A" stroke-width="1" fill="none">
    <path d="M112 82 L82 82 L82 112"/>
    <path d="M968 82 L998 82 L998 112"/>
    <path d="M82 968 L82 998 L112 998"/>
    <path d="M998 968 L998 998 L968 998"/>
  </g>

  <!-- Wordmark PATRIMOLUX -->
  <text x="540" y="198" text-anchor="middle" class="serif"
        font-size="44" font-weight="500" fill="#0F1E2E"
        letter-spacing="14">PATRIMOLUX</text>

  <!-- Eyebrow -->
  <text x="540" y="234" text-anchor="middle" class="sans"
        font-size="12" font-weight="700" fill="#B8975A"
        letter-spacing="6">— GESTION DE PATRIMOINE PRIVÉE —</text>

  <!-- Divider doré -->
  <line x1="478" y1="286" x2="602" y2="286" stroke="url(#goldGradient)" stroke-width="1.3"/>

  <!-- Accroche principale (3 lignes, serif ultra premium) -->
  <text x="540" y="398" text-anchor="middle" class="serif"
        font-size="70" font-weight="500" fill="#0F1E2E">Votre épargne</text>
  <text x="540" y="482" text-anchor="middle" class="serif"
        font-size="70" font-weight="500" fill="#0F1E2E">est-elle vraiment</text>
  <text x="540" y="572" text-anchor="middle" class="serif"
        font-size="72" font-weight="500" font-style="italic" fill="#B8975A">protégée&#160;?</text>

  <!-- Divider doré -->
  <line x1="420" y1="640" x2="660" y2="640" stroke="#B8975A" stroke-width="0.8" opacity="0.7"/>

  <!-- Sous-titre -->
  <text x="540" y="712" text-anchor="middle" class="serif"
        font-size="30" font-weight="400" fill="#0F1E2E">Au Luxembourg, votre capital</text>
  <text x="540" y="756" text-anchor="middle" class="serif"
        font-size="30" font-weight="400" fill="#0F1E2E">est garanti à <tspan font-weight="600">100&#160;%</tspan> par la loi.</text>

  <!-- CTA : bouton navy + liseré doré -->
  <g>
    <rect x="350" y="836" width="380" height="78" fill="#0F1E2E"/>
    <rect x="359" y="845" width="362" height="60" fill="none" stroke="#B8975A" stroke-width="1"/>
    <text x="540" y="882" text-anchor="middle" class="sans"
          font-size="16" font-weight="700" fill="#D4B773"
          letter-spacing="7">ANALYSE GRATUITE</text>
  </g>

  <!-- URL -->
  <text x="540" y="965" text-anchor="middle" class="serif"
        font-size="24" font-weight="500" font-style="italic" fill="#0F1E2E"
        letter-spacing="2">patrimolux.fr</text>

  <!-- Micro-mention "triangle de sécurité" en bas -->
  <text x="540" y="1000" text-anchor="middle" class="sans"
        font-size="10" font-weight="400" fill="#0F1E2E" opacity="0.55"
        letter-spacing="3">TRIANGLE DE SÉCURITÉ · ARCHITECTURE OUVERTE · PORTABILITÉ</text>
</svg>
